[project]
name = "yt-pipeline"
version = "0.2.0"
description = "Video batch-processing pipeline with graceful shutdown and interrupt-resume."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
yt-pipeline = "yt_pipeline.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-timeout",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
asyncio_mode = "auto"
