[project]
name = "yt-pipeline"
version = "0.3.0"
description = "Video batch-processing pipeline with graceful shutdown and interrupt-resume."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp",
]

[project.scripts]
ytpp = "yt_pipeline.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-timeout",
]
clipboard = [
    "pyperclip",
]

[tool.ruff.lint.per-file-ignores]
# worker 的兜底 except Exception：异常统一交给 handle_worker_error 标记任务失败
"yt_pipeline/assessment_worker.py" = ["BLE001"]
"yt_pipeline/download_worker.py" = ["BLE001"]
"yt_pipeline/transcode_worker.py" = ["BLE001"]
# 进度文件损坏时回退到全新运行
"yt_pipeline/persistence.py" = ["BLE001"]
# 剪贴板轮询：读取失败直接忽略并重试
"yt_pipeline/url_collector.py" = ["BLE001", "S110"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
